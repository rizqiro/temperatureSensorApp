name: draft_sensor_app
description: Fetch convection-draft sensor logs from ESP32 nodes over local Wi-Fi and share them as CSV.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  share_plus: ^9.0.0
  uuid: ^4.4.0
  intl: ^0.19.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
